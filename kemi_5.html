<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plugga kemi – kolatomen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#1E2340; --soft:#5D6480; --line:#D9DFE6;
  --red:#D7263D; --orange:#EE7A2B; --yellow:#F2B705; --green:#3FA34D; --teal:#1F9E9A; --blue:#2B59C3; --violet:#6A3FB5;
  --okbg:#DDF3E1; --badbg:#FBE0E4; --carbon:#2A2F45; --hyd:#8A93AD;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141827; --card:#1E2338; --ink:#ECEFF7; --soft:#A6ADC6; --line:#30375A; --okbg:#173A24; --badbg:#47202A; --carbon:#ECEFF7; --hyd:#8A93AD; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:Outfit,Lexend,system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}

/* hexagon strip – grafen som signatur */
.hexes{display:flex;gap:3px;margin:14px 0 4px;height:26px;overflow:hidden}
.hexes svg{flex:none}

header h1{font-size:2.1rem;font-weight:800;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--soft)}

.modes{display:grid;gap:12px;margin-top:20px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.mode:hover{border-color:var(--ink)}
.mode .ic{flex:none;width:44px;height:44px}
.mode h2{font-size:1.2rem}
.mode p{margin:2px 0 0;color:var(--soft);font-size:.93rem}
.group{margin:22px 0 -4px;color:var(--soft);font-size:.85rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.backbtn{background:none;border:none;padding:6px 0;color:var(--soft);font-weight:600}
.count{color:var(--soft);font-size:.95rem}

.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;margin-top:14px}
.panel h3{font-size:1.25rem;margin-bottom:8px}
.panel p{margin:8px 0}
.panel ul{margin:8px 0;padding-left:20px}
.panel li{margin-bottom:4px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--soft)}
.key{background:var(--bg);border-left:4px solid var(--teal);border-radius:0 10px 10px 0;padding:10px 14px;margin:10px 0}

/* flashcard */
.flash{perspective:1200px;margin-top:14px}
.flash-inner{position:relative;min-height:290px;transition:transform .45s ease;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face small{color:var(--soft);font-size:.85rem;position:absolute;top:16px;left:24px}
.face .term{font-family:Outfit,sans-serif;font-size:2rem;font-weight:700;text-align:center}
.face .def{font-size:1.05rem}
.hint{text-align:center;color:var(--soft);font-size:.9rem;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:none;border-radius:14px;padding:14px;font-weight:600;font-size:1rem;background:var(--bg)}
.btn.again{background:var(--badbg)}
.btn.know{background:var(--okbg)}
.btn.main{background:var(--ink);color:var(--bg);width:100%;margin-top:16px}
.btn:disabled{opacity:.4;cursor:default}

/* quiz */
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;margin-top:14px}
.q h3{font-size:1.25rem;font-weight:700}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--green)}
.opt.wrong{background:var(--badbg);border-color:var(--red)}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--blue);background:var(--bg);border-radius:0 10px 10px 0}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--teal);transition:width .4s ease}

.result{text-align:center;margin-top:30px}
.result .big{font-family:Outfit,sans-serif;font-size:4rem;font-weight:800;line-height:1}
.result p{color:var(--soft)}
.done-list{text-align:left;margin-top:18px}
.done-list li{margin-bottom:8px}
.hidden{display:none!important}

/* molekylbyggare */
.mol{width:100%;height:auto;display:block;margin:6px auto 0;max-height:260px}
.mol text{font-family:Outfit,sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central}
.mol .c{fill:var(--carbon);font-size:24px}
.mol .h{fill:var(--hyd);font-size:20px}
.mol line{stroke:var(--soft);stroke-width:2.4;stroke-linecap:round}
.mol line.cc{stroke:var(--ink)}
.mol line.multi{stroke:var(--orange);stroke-width:3}
.ctrl{margin-top:14px}
.ctrl label{display:block;font-size:.9rem;color:var(--soft);font-weight:600;margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fact{background:var(--bg);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-family:Outfit,sans-serif;font-size:1.35rem}
.fact span{font-size:.82rem;color:var(--soft)}
.warn{background:var(--badbg);border-radius:12px;padding:12px 14px;margin-top:12px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.95rem}
.toggle input{width:22px;height:22px}

/* förklara */
textarea{width:100%;min-height:110px;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:.98rem}
.check input{width:20px;height:20px;margin-top:3px;flex:none}

/* kretslopp */
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--teal)}
.where{font-family:Outfit,sans-serif;font-size:1.5rem;font-weight:800}
@media (prefers-reduced-motion:reduce){.flash-inner,.progress i{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <!-- START -->
  <section id="home">
    <header>
      <h1>Kolatomen – en mångsidig byggsten</h1>
      <p>Kemi kapitel 5.1–5.4. Välj hur du vill plugga.</p>
      <div class="hexes" id="homeHex" aria-hidden="true"></div>
    </header>
    <p class="group">Lär dig</p>
    <div class="modes">
      <button class="mode" data-go="sum"><span class="ic" data-hex="var(--teal)"></span><span><h2>Genomgång</h2><p>Det viktigaste i 5.1–5.4, kort och tydligt.</p></span></button>
      <button class="mode" data-go="cycle"><span class="ic" data-hex="var(--green)"></span><span><h2>Kolets kretslopp</h2><p>Följ en kolatom steg för steg.</p></span></button>
      <button class="mode" data-go="build"><span class="ic" data-hex="var(--orange)"></span><span><h2>Molekylbyggaren</h2><p>Bygg kolväten och se namn, formel och strukturformel.</p></span></button>
    </div>
    <p class="group">Öva</p>
    <div class="modes">
      <button class="mode" data-go="cards"><span class="ic" data-hex="var(--blue)"></span><span><h2>Begrepp</h2><p>Alla ord i begreppslistan som kort att vända.</p></span></button>
      <button class="mode" data-go="name"><span class="ic" data-hex="var(--violet)"></span><span><h2>Namnge molekylen</h2><p>10 molekyler. Vad heter de, vilken formel har de?</p></span></button>
      <button class="mode" data-go="quiz"><span class="ic" data-hex="var(--red)"></span><span><h2>Quiz</h2><p>10 frågor i taget med förklaring efter varje svar.</p></span></button>
      <button class="mode" data-go="explain"><span class="ic" data-hex="var(--yellow)"></span><span><h2>Förklara</h2><p>Provfrågor där du skriver eget svar och rättar själv.</p></span></button>
      <button class="mode" data-go="exam"><span class="ic" data-hex="var(--ink)"></span><span><h2>Övningsprov</h2><p>Alla quizfrågor i blandad ordning.</p></span></button>
    </div>
    <p class="hint" id="homeProgress"></p>
  </section>

  <!-- GENOMGÅNG -->
  <section id="sum" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button></div>
    <h2>Genomgång</h2>
    <div class="chips" id="sumChips" role="group" aria-label="Välj avsnitt"></div>
    <div id="sumBody"></div>
  </section>

  <!-- KRETSLOPP -->
  <section id="cycle" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button><span class="count" id="cycCount"></span></div>
    <h2>Kolets kretslopp</h2>
    <div class="panel">
      <span class="tag" id="cycTag"></span>
      <p class="where" id="cycWhere"></p>
      <p id="cycText"></p>
      <div class="key hidden" id="cycKey"></div>
    </div>
    <div class="dots" id="cycDots"></div>
    <div class="row">
      <button class="btn" id="cycPrev">‹ Förra</button>
      <button class="btn know" id="cycNext">Nästa ›</button>
    </div>
  </section>

  <!-- BYGGARE -->
  <section id="build" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button></div>
    <h2>Molekylbyggaren</h2>
    <div class="panel">
      <svg class="mol" id="bSvg" viewBox="0 0 440 220" role="img" aria-label="Strukturformel"></svg>
      <div id="bWarn" class="warn hidden"></div>
      <div class="facts" id="bFacts"></div>
      <p id="bNote" style="font-size:.95rem;color:var(--soft)"></p>
    </div>
    <div class="ctrl">
      <label>Antal kolatomer</label>
      <div class="seg" id="bN"></div>
    </div>
    <div class="ctrl">
      <label>Bindning mellan de två första kolatomerna</label>
      <div class="seg three" id="bB"></div>
    </div>
    <label class="toggle hidden" id="bIsoWrap"><input type="checkbox" id="bIso"> Grenad kedja (isobutan)</label>
  </section>

  <!-- KORT -->
  <section id="cards" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button><span class="count" id="cardCount"></span></div>
    <h2>Begrepp</h2>
    <div class="chips" id="cardChips" role="group" aria-label="Välj avsnitt"></div>
    <div class="flash" id="flash" tabindex="0" role="button" aria-label="Vänd kortet">
      <div class="flash-inner">
        <div class="face front"><small id="cardSec"></small><div class="term" id="cardTerm"></div></div>
        <div class="face back"><small id="cardSec2"></small><div class="def" id="cardDef"></div></div>
      </div>
    </div>
    <p class="hint" id="cardHint">Tryck på kortet för att vända det.</p>
    <div class="row" id="cardRow">
      <button class="btn again" id="cardAgain">Öva mer</button>
      <button class="btn know" id="cardKnow">Jag kan den</button>
    </div>
    <div class="result hidden" id="cardsDone">
      <div class="big">Klart!</div>
      <p>Du kan alla kort i det här urvalet.</p>
      <button class="btn main" id="cardsReset">Börja om med alla kort</button>
    </div>
  </section>

  <!-- QUIZ (används även för namnge och prov) -->
  <section id="quiz" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button><span class="count" id="quizCount"></span></div>
    <div class="progress" aria-hidden="true"><i id="quizBar" style="width:0%"></i></div>
    <div class="q" id="qBox">
      <svg class="mol hidden" id="qSvg" viewBox="0 0 440 220" role="img" aria-label="Strukturformel"></svg>
      <h3 id="qText"></h3>
      <div class="opts" id="qOpts"></div>
      <div class="explain hidden" id="qExplain"></div>
      <button class="btn main hidden" id="qNext">Nästa fråga</button>
    </div>
    <div class="result hidden" id="qResult">
      <div class="big" id="qScore"></div>
      <p id="qVerdict"></p>
      <div class="done-list" id="qMissed"></div>
      <button class="btn main" id="qAgain">Kör igen</button>
    </div>
  </section>

  <!-- FÖRKLARA -->
  <section id="explain" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button><span class="count" id="exCount"></span></div>
    <h2>Förklara</h2>
    <div class="q">
      <span class="tag" id="exSec"></span>
      <h3 id="exQ" style="margin-top:8px"></h3>
      <textarea id="exText" placeholder="Skriv ditt svar här, som på provet …"></textarea>
      <button class="btn main" id="exShow">Visa vad svaret ska innehålla</button>
      <div id="exAns" class="hidden">
        <p style="margin:16px 0 4px;font-weight:600">Bocka för det du fick med:</p>
        <div id="exChecks"></div>
        <div class="explain" id="exModel"></div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="exPrev">‹ Förra</button>
      <button class="btn know" id="exNext">Nästa ›</button>
    </div>
  </section>

</div>

<script>
const $ = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const SUB = "₀₁₂₃₄₅₆₇₈₉";
const sub = n => String(n).split("").map(d=>SUB[+d]).join("");
const formula = (c,h) => "C"+(c>1?sub(c):"")+"H"+(h>1?sub(h):"");

// ---------- hexagoner ----------
function hexSvg(color,size){
  const s=size, r=s/2, pts=[];
  for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);pts.push((r+r*0.92*Math.cos(a)).toFixed(1)+","+(r+r*0.92*Math.sin(a)).toFixed(1));}
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}"><polygon points="${pts.join(" ")}" fill="${color}"/></svg>`;
}
(function(){
  const cols=["var(--teal)","var(--green)","var(--orange)","var(--blue)","var(--violet)","var(--red)","var(--yellow)"];
  let h=""; for(let i=0;i<30;i++) h+=hexSvg(cols[i%cols.length],24);
  $("homeHex").innerHTML=h;
  document.querySelectorAll("[data-hex]").forEach(e=>e.innerHTML=hexSvg(e.dataset.hex,44));
})();

// ---------- strukturformler ----------
const PRE = ["met","et","prop","but","pent"];
const SUF = {1:"an",2:"en",3:"yn"};
const GROUP = {1:"alkan",2:"alken",3:"alkyn"};
function hCount(n,b){ return b===1 ? 2*n+2 : b===2 ? 2*n : 2*n-2; }
function molName(n,b,iso){ return iso ? "isobutan" : PRE[n-1]+SUF[b]; }

function drawMol(svg,n,b,iso){
  const W=440,H=220, cy=iso?85:110, gap=iso?84:76;
  const startX = W/2 - gap*((iso?3:n)-1)/2;
  let out=[];
  const atoms=[], bonds=[];
  if(iso){
    const xs=[startX,startX+gap,startX+2*gap];
    xs.forEach(x=>atoms.push({x,y:cy}));
    atoms.push({x:xs[1],y:cy+70});
    bonds.push([0,1,1],[1,2,1],[1,3,1]);
  } else {
    for(let i=0;i<n;i++) atoms.push({x:startX+i*gap,y:cy});
    for(let i=0;i<n-1;i++) bonds.push([i,i+1,i===0?b:1]);
  }
  const hs=[];
  const D=50;
  if(iso){
    const [a0,a1,a2,a3]=atoms;
    hs.push([a0,a0.x,a0.y-D],[a0,a0.x,a0.y+D],[a0,a0.x-D,a0.y]);
    hs.push([a2,a2.x,a2.y-D],[a2,a2.x,a2.y+D],[a2,a2.x+D,a2.y]);
    hs.push([a1,a1.x,a1.y-D]);
    hs.push([a3,a3.x,a3.y+D],[a3,a3.x-40,a3.y+30],[a3,a3.x+40,a3.y+30]);
  } else {
    atoms.forEach((a,i)=>{
      let used=0; bonds.forEach(([p,q,o])=>{ if(p===i||q===i) used+=o; });
      const h=4-used;
      const up=[a,a.x,a.y-D], dn=[a,a.x,a.y+D], lf=[a,a.x-D,a.y], rt=[a,a.x+D,a.y];
      if(n===1){ hs.push(up,dn,lf,rt); return; }
      const end = i===0 ? lf : (i===n-1 ? rt : null);
      let slots;
      if(end){ slots = h===3?[up,dn,end]:h===2?[up,dn]:h===1?[end]:[]; }
      else   { slots = h===2?[up,dn]:h===1?[up]:[]; }
      hs.push(...slots);
    });
  }
  // bindningar C–C
  bonds.forEach(([p,q,o])=>{
    const A=atoms[p],B=atoms[q];
    const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, nx=-uy, ny=ux, s=17;
    const offs = o===1?[0]:o===2?[-4.5,4.5]:[-7,0,7];
    offs.forEach(k=>out.push(`<line class="cc${o>1?" multi":""}" x1="${A.x+ux*s+nx*k}" y1="${A.y+uy*s+ny*k}" x2="${B.x-ux*s+nx*k}" y2="${B.y-uy*s+ny*k}"/>`));
  });
  // bindningar C–H
  hs.forEach(([a,x,y])=>{
    const dx=x-a.x, dy=y-a.y, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L;
    out.push(`<line x1="${a.x+ux*16}" y1="${a.y+uy*16}" x2="${x-ux*12}" y2="${y-uy*12}"/>`);
  });
  atoms.forEach(a=>out.push(`<text class="c" x="${a.x}" y="${a.y}">C</text>`));
  hs.forEach(([a,x,y])=>out.push(`<text class="h" x="${x}" y="${y}">H</text>`));
  svg.setAttribute("viewBox", `0 0 ${W} ${iso?250:H}`);
  svg.innerHTML=out.join("");
}

// ---------- byggaren ----------
let bn=2,bb=1,biso=false;
$("bN").innerHTML=[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join("");
$("bB").innerHTML=[[1,"Enkel"],[2,"Dubbel"],[3,"Trippel"]].map(([b,t])=>`<button data-b="${b}">${t}</button>`).join("");
$("bN").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;bn=+t.dataset.n;renderBuild();});
$("bB").addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;bb=+t.dataset.b;renderBuild();});
$("bIso").addEventListener("change",e=>{biso=e.target.checked;renderBuild();});
const USES = {
  metan:"Färglös och luktfri gas. Huvuddelen av naturgas och biogas.",
  etan:"Färglös gas. Finns i naturgas.",
  propan:"Gas som finns i gasol (t.ex. till grillen).",
  butan:"Gas som finns i gasol och i tändare.",
  pentan:"Vätska i rumstemperatur. Längre kedja = högre kokpunkt.",
  isobutan:"Samma molekylformel som butan, C₄H₁₀, men grenad. Kokpunkt −12 °C (normalbutan 0 °C). Butan och isobutan är isomerer.",
  eten:"Används för att tillverka plasten polyeten. Får också frukt att mogna.",
  etyn:"Kallas också acetylen. Brinner mycket varmt och används vid svetsning.",
};
function renderBuild(){
  const canIso = bn===4 && bb===1;
  $("bIsoWrap").classList.toggle("hidden",!canIso);
  if(!canIso){ biso=false; $("bIso").checked=false; }
  $("bN").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.n===bn));
  $("bB").querySelectorAll("button").forEach(x=>{x.setAttribute("aria-pressed",+x.dataset.b===bb); x.disabled = bn===1 && +x.dataset.b>1;});
  if(bn===1 && bb>1) bb=1;
  $("bB").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.b===bb));
  $("bWarn").classList.toggle("hidden", bn!==1);
  $("bWarn").textContent = "Med bara en kolatom finns ingen annan kolatom att dubbel- eller trippelbinda till. Därför finns inte ”meten” eller ”metyn”.";
  drawMol($("bSvg"),bn,bb,biso);
  const h=hCount(bn,bb), nm=molName(bn,bb,biso);
  $("bFacts").innerHTML=[
    [nm,"namn"],[formula(bn,h),"molekylformel"],
    [GROUP[bb],"grupp (namnet slutar på -"+SUF[bb]+")"],
    [bb===1?"mättat":"omättat", bb===1?"bara enkelbindningar":(bb===2?"har en dubbelbindning":"har en trippelbindning")]
  ].map(([v,l])=>`<div class="fact"><b>${v}</b><span>${l}</span></div>`).join("");
  const base = USES[nm] || "";
  const prefix = `Förled ”${PRE[bn-1]}-” = ${bn} kolatom${bn>1?"er":""}. `;
  $("bNote").textContent = biso ? base : prefix + base;
}

// ---------- namnge-molekylen ----------
const MOLS=[];
for(let n=1;n<=5;n++){ MOLS.push([n,1,false]); }
for(let n=2;n<=4;n++){ MOLS.push([n,2,false]); MOLS.push([n,3,false]); }
MOLS.push([4,1,true]);
function makeNameQs(k){
  const pick=shuffle(MOLS).slice(0,k);
  return pick.map(([n,b,iso],i)=>{
    const nm=molName(n,b,iso), f=formula(n,hCount(n,b));
    if(i%2===0){
      // vad heter den?
      const wrong=new Set();
      const cand=[PRE[n-1]+SUF[1],PRE[n-1]+SUF[2],PRE[n-1]+SUF[3],PRE[Math.max(0,n-2)]+SUF[b],PRE[Math.min(4,n)]+SUF[b],"meten"];
      if(iso) cand.push("butan","buten","propan");
      shuffle(cand).forEach(c=>{ if(c!==nm && wrong.size<3 && !(iso&&c==="isobutan")) wrong.add(c); });
      const opts=shuffle([nm,...wrong]);
      const why = iso ? "Den har 4 kolatomer, bara enkelbindningar och en gren. Det är isobutan, en isomer till butan."
        : `${n} kolatom${n>1?"er":""} = ”${PRE[n-1]}-”. ${b===1?"Bara enkelbindningar = -an.":b===2?"En dubbelbindning = -en.":"En trippelbindning = -yn."} Formel ${f}.`;
      return {mol:[n,b,iso],q:"Vad heter molekylen?",o:opts,r:opts.indexOf(nm),w:why};
    } else {
      const h0=hCount(n,b);
      const pairs=[[n,hCount(n,1)],[n,hCount(n,2)],[n,hCount(n,3)],[n+1,h0],[n,h0+2],[n-1,h0],[n,h0-2]];
      const fs=new Set([f]);
      shuffle(pairs).forEach(([c,h])=>{ if(c>=1 && h>=2 && fs.size<4) fs.add(formula(c,h)); });
      const opts=shuffle([...fs]);
      const why = `${nm}: ${n} kol. ${b===1?"Alkan → 2·"+n+"+2":b===2?"Alken → 2·"+n:"Alkyn → 2·"+n+"−2"} = ${hCount(n,b)} väteatomer. Räkna H i bilden!`;
      return {mol:[n,b,iso],q:`Vilken molekylformel har ${nm}?`,o:opts,r:opts.indexOf(f),w:why};
    }
  });
}

// ---------- quizmotor ----------
let qs=[], qi=0, score=0, missed=[];
function fromQuiz(list){ return list.map(([q,o,r,w])=>({q,o,r,w})); }
function startQuiz(list){
  qs=list; qi=0; score=0; missed=[];
  $("qBox").classList.remove("hidden"); $("qResult").classList.add("hidden");
  renderQ();
}
function renderQ(){
  const it=qs[qi];
  $("quizCount").textContent=`Fråga ${qi+1} av ${qs.length} · ${score} rätt`;
  $("quizBar").style.width=(qi/qs.length*100)+"%";
  $("qText").textContent=it.q;
  $("qSvg").classList.toggle("hidden",!it.mol);
  if(it.mol) drawMol($("qSvg"),...it.mol);
  $("qExplain").classList.add("hidden"); $("qNext").classList.add("hidden");
  const idx=it.o.map((o,i)=>i);
  const order= (it.o.length>2 && !it.mol) ? shuffle(idx) : idx;
  $("qOpts").classList.toggle("two", it.o.length===2 || !!it.mol);
  $("qOpts").innerHTML=order.map(i=>`<button class="opt" data-i="${i}">${it.o[i]}</button>`).join("");
}
$("qOpts").addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b||b.disabled) return;
  const it=qs[qi], pick=+b.dataset.i;
  $("qOpts").querySelectorAll(".opt").forEach(o=>{o.disabled=true; if(+o.dataset.i===it.r) o.classList.add("right");});
  if(pick===it.r){ score++; $("qExplain").textContent="Rätt! "+it.w; }
  else { b.classList.add("wrong"); missed.push(it); $("qExplain").textContent="Inte riktigt. "+it.w; }
  $("quizCount").textContent=`Fråga ${qi+1} av ${qs.length} · ${score} rätt`;
  $("qExplain").classList.remove("hidden");
  $("qNext").textContent= qi===qs.length-1 ? "Se resultat" : "Nästa fråga";
  $("qNext").classList.remove("hidden"); $("qNext").focus();
});
$("qNext").addEventListener("click",()=>{
  qi++;
  if(qi<qs.length){ renderQ(); window.scrollTo(0,0); return; }
  $("quizBar").style.width="100%";
  $("qBox").classList.add("hidden"); $("qResult").classList.remove("hidden");
  $("qScore").textContent=`${score}/${qs.length}`;
  const p=score/qs.length;
  $("qVerdict").textContent= p===1?"Alla rätt. Du är redo!": p>=0.8?"Riktigt bra. Kolla frågorna nedan en gång till.": p>=0.5?"Bra jobbat. Öva på frågorna nedan och kör igen.":"Fortsätt öva. Läs genomgången och testa begreppskorten.";
  $("qMissed").innerHTML= missed.length ? "<h3>Öva mer på</h3><ul>"+missed.map(m=>`<li><strong>${m.q}</strong><br>${m.o[m.r]}</li>`).join("")+"</ul>" : "";
  $("quizCount").textContent="Klart";
});
let lastMode="quiz";
$("qAgain").addEventListener("click",()=>launch(lastMode));

const VIEWS=["home","sum","cycle","build","cards","quiz","explain"];
function show(id){ VIEWS.forEach(s=>$(s).classList.toggle("hidden",s!==id)); window.scrollTo(0,0); }
function launch(g){
  if(g==="home"){ homeProgress(); show("home"); return; }
  if(g==="sum"){ renderSum(); show("sum"); }
  if(g==="cycle"){ renderCycle(); show("cycle"); }
  if(g==="build"){ renderBuild(); show("build"); }
  if(g==="cards"){ startCards(); show("cards"); }
  if(g==="explain"){ renderEx(); show("explain"); }

}
