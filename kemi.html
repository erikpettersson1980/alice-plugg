<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plugga kemi – syror, baser och salter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#1E2340; --soft:#5D6480; --line:#D9DFE6;
  --red:#D7263D; --orange:#EE7A2B; --yellow:#F2B705; --green:#3FA34D; --teal:#1F9E9A; --blue:#2B59C3; --violet:#6A3FB5;
  --okbg:#DDF3E1; --badbg:#FBE0E4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141827; --card:#1E2338; --ink:#ECEFF7; --soft:#A6ADC6; --line:#30375A;
    --okbg:#173A24; --badbg:#47202A;
  }
}
:root[data-theme="dark"]{
  --bg:#141827; --card:#1E2338; --ink:#ECEFF7; --soft:#A6ADC6; --line:#30375A;
  --okbg:#173A24; --badbg:#47202A;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:Outfit,Lexend,system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 40px}

/* pH-strip: the signature element */
.strip{display:grid;grid-template-columns:repeat(15,1fr);height:14px;border-radius:7px;overflow:hidden;margin:14px 0 6px}
.strip span{display:block}
.strip.big{height:22px;border-radius:11px}
.marker{position:relative;height:16px}
.marker i{position:absolute;top:0;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:12px solid var(--ink);transform:translateX(-8px);transition:left .5s ease}

header h1{font-size:2.1rem;font-weight:800;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--soft)}

.modes{display:grid;gap:12px;margin-top:22px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px}
.mode:hover{border-color:var(--ink)}
.drop{flex:none;width:44px;height:44px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg)}
.mode h2{font-size:1.25rem}
.mode p{margin:2px 0 0;color:var(--soft);font-size:.95rem}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.backbtn{background:none;border:none;padding:6px 0;color:var(--soft);font-weight:600}
.count{color:var(--soft);font-size:.95rem}

/* flashcard */
.flash{perspective:1200px;margin-top:14px}
.flash-inner{position:relative;min-height:280px;transition:transform .45s ease;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face small{color:var(--soft);font-size:.85rem;position:absolute;top:16px;left:24px}
.face .term{font-family:Outfit,sans-serif;font-size:2rem;font-weight:700;text-align:center}
.face .def{font-size:1.08rem}
.hint{text-align:center;color:var(--soft);font-size:.9rem;margin-top:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{border:none;border-radius:14px;padding:14px;font-weight:600;font-size:1rem}
.btn.again{background:var(--badbg)}
.btn.know{background:var(--okbg)}
.btn.main{background:var(--ink);color:var(--bg);width:100%;margin-top:16px}

/* quiz */
.q{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;margin-top:14px}
.q h3{font-size:1.3rem;font-weight:700}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--okbg);border-color:var(--green)}
.opt.wrong{background:var(--badbg);border-color:var(--red)}
.explain{margin-top:14px;padding:12px 14px;border-left:4px solid var(--blue);background:var(--bg);border-radius:0 10px 10px 0}

.result{text-align:center;margin-top:30px}
.result .big{font-family:Outfit,sans-serif;font-size:4rem;font-weight:800;line-height:1}
.result p{color:var(--soft)}
.done-list{text-align:left;margin-top:18px}
.done-list li{margin-bottom:8px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.flash-inner,.marker i{transition:none}}
</style>
</head>
<body>
<div class="wrap">

  <!-- START -->
  <section id="home">
    <header>
      <h1>Syror, baser och salter</h1>
      <p>Kemi kapitel 4. Välj hur du vill plugga.</p>
      <div class="strip big" id="homeStrip" aria-hidden="true"></div>
    </header>
    <div class="modes">
      <button class="mode" data-go="cards">
        <span class="drop" style="background:var(--blue)"></span>
        <span><h2>Begrepp</h2><p>Kort att vända. Säg svaret högt och vänd sedan.</p></span>
      </button>
      <button class="mode" data-go="quiz">
        <span class="drop" style="background:var(--red)"></span>
        <span><h2>Quiz</h2><p>10 frågor i taget med förklaring efter varje svar.</p></span>
      </button>
      <button class="mode" data-go="exam">
        <span class="drop" style="background:var(--green)"></span>
        <span><h2>Övningsprov</h2><p>Alla quizfrågor i blandad ordning. Som provet.</p></span>
      </button>
    </div>
    <p class="hint" id="homeProgress"></p>
  </section>

  <!-- KORT -->
  <section id="cards" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button><span class="count" id="cardCount"></span></div>
    <h2>Begrepp</h2>
    <div class="chips" id="cardChips" role="group" aria-label="Välj avsnitt"></div>
    <div class="flash" id="flash" tabindex="0" role="button" aria-label="Vänd kortet">
      <div class="flash-inner">
        <div class="face front"><small id="cardSec"></small><div class="term" id="cardTerm"></div></div>
        <div class="face back"><small id="cardSec2"></small><div class="def" id="cardDef"></div></div>
      </div>
    </div>
    <p class="hint">Tryck på kortet för att vända det.</p>
    <div class="row">
      <button class="btn again" id="cardAgain">Öva mer</button>
      <button class="btn know" id="cardKnow">Jag kan den</button>
    </div>
    <div class="result hidden" id="cardsDone">
      <div class="big">Klart!</div>
      <p>Du kan alla kort i det här urvalet.</p>
      <button class="btn main" id="cardsReset">Börja om med alla kort</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="top"><button class="backbtn" data-go="home">‹ Tillbaka</button><span class="count" id="quizCount"></span></div>
    <div class="strip" id="quizStrip" aria-hidden="true"></div>
    <div class="marker" aria-hidden="true"><i id="quizMarker" style="left:0%"></i></div>
    <div class="q" id="qBox">
      <h3 id="qText"></h3>
      <div class="opts" id="qOpts"></div>
      <div class="explain hidden" id="qExplain"></div>
      <button class="btn main hidden" id="qNext">Nästa fråga</button>
    </div>
    <div class="result hidden" id="qResult">
      <div class="big" id="qScore"></div>
      <p id="qVerdict"></p>
      <div class="done-list" id="qMissed"></div>
      <button class="btn main" id="qAgain">Kör igen</button>
    </div>
  </section>

</div>

 ["Varför saltar man vägar på vintern?",["Saltet sänker isens smältpunkt","Saltet gör isen hårdare","Saltet värmer vägen","Saltet tar bort snö direkt"],0,"Isen smälter fast det är minusgrader. Nackdel: rost och skadade växter."],
 ["Är koldioxid en molekylförening eller jonförening?",["Molekylförening","Jonförening"],0,"Icke-metall + syre = molekylförening."],
 ["Vad stämmer om metalloxider?",["De är gaser","De är jonföreningar och fasta","De är syror","De är molekylföreningar"],1,"Metalloxider är jonföreningar och fasta ämnen."],
 ["Järn brinner i ren syrgas. Vad bildas?",["Magnetit, svart","Hematit, röd","Aluminiumoxid","Rost"],1,"Ren syrgas → hematit Fe₂O₃ (röd). Luft → magnetit Fe₃O₄ (svart)."],
 ["Vad är formeln för magnetit?",["Fe₂O₃","Fe₃O₄","FeO","Al₂O₃"],1,"Magnetit = Fe₃O₄, bildas när järn brinner i luft."],
 ["Varför rostar inte en läskburk av aluminium sönder?",["Den är målad","En tunn hinna av aluminiumoxid skyddar metallen","Aluminium är en ädel metall","Läsken skyddar den"],1,"Aluminiumoxiden bildar en tät skyddande hinna. Rost på järn har hål och skyddar inte."],
 ["Vilka ädelstenar består av aluminiumoxid?",["Diamant och smaragd","Rubin och safir","Bärnsten och pärla","Opal och kvarts"],1,"Korund = aluminiumoxid. Röd = rubin, blå = safir."]
];

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const PH = ["#D7263D","#E04A2F","#EE7A2B","#F29F1D","#F2B705","#C6C23A","#8DB648","#3FA34D","#2E9D74","#1F9E9A","#2483AE","#2B59C3","#4848BC","#5A44B9","#6A3FB5"];
function paintStrip(el){ el.innerHTML = PH.map(c=>`<span style="background:${c}"></span>`).join(""); }
paintStrip($("homeStrip")); paintStrip($("quizStrip"));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem("kem4-known")||"[]")); } catch(e){}
function saveKnown(){ try{ localStorage.setItem("kem4-known", JSON.stringify([...known])); }catch(e){} }
function homeProgress(){ $("homeProgress").textContent = `Du kan ${known.size} av ${CARDS.length} begrepp.`; }

function show(id){
  ["home","cards","quiz"].forEach(s=>$(s).classList.toggle("hidden", s!==id));
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{
  const g=b.dataset.go;
  if(g==="home"){ homeProgress(); show("home"); }
  if(g==="cards"){ startCards(); show("cards"); }
  if(g==="quiz"){ startQuiz(10); show("quiz"); }
  if(g==="exam"){ startQuiz(QUIZ.length); show("quiz"); }
}));

// ---------- kort ----------
let section = "alla", deck = [], cur = null;
const chips = $("cardChips");
chips.innerHTML = [["alla","Alla"],...Object.entries(SECTIONS)].map(([k,v])=>`<button class="chip" data-sec="${k}" aria-pressed="${k==="alla"}">${k==="alla"||k==="F"?v:k+" "+v}</button>`).join("");
chips.addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  section=b.dataset.sec;
  chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b));
  startCards();
});
const keyOf = c => c[0]+"|"+c[1];
function startCards(){
  deck = shuffle(CARDS.filter(c=>(section==="alla"||c[0]===section) && !known.has(keyOf(c))));
  nextCard();
}
function nextCard(){
  $("flash").classList.remove("flipped");
  const pool = CARDS.filter(c=>section==="alla"||c[0]===section);
  const left = pool.filter(c=>!known.has(keyOf(c))).length;
  $("cardCount").textContent = `${pool.length-left} av ${pool.length} kan du`;
  const empty = deck.length===0;
  $("flash").classList.toggle("hidden",empty);
  document.querySelector("#cards .row").classList.toggle("hidden",empty);
  document.querySelector("#cards .hint").classList.toggle("hidden",empty);
  $("cardsDone").classList.toggle("hidden",!empty);
  if(empty) return;
  cur = deck.shift();
  const label = cur[0]==="F" ? "Formel – vad blir det?" : `${cur[0]} ${SECTIONS[cur[0]]}`;
  $("cardSec").textContent = label; $("cardSec2").textContent = cur[1];
  $("cardTerm").textContent = cur[1]; $("cardDef").textContent = cur[2];
}
const flip = ()=>$("flash").classList.toggle("flipped");
$("flash").addEventListener("click",flip);
$("flash").addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} });
$("cardKnow").addEventListener("click",()=>{ known.add(keyOf(cur)); saveKnown(); nextCard(); });
$("cardAgain").addEventListener("click",()=>{ deck.splice(Math.min(3,deck.length),0,cur); nextCard(); });
$("cardsReset").addEventListener("click",()=>{
  CARDS.filter(c=>section==="alla"||c[0]===section).forEach(c=>known.delete(keyOf(c)));
  saveKnown(); startCards();
});

// ---------- quiz ----------
let qs=[], qi=0, score=0, missed=[];
function startQuiz(n){
  qs = shuffle(QUIZ).slice(0,n); qi=0; score=0; missed=[];
  $("qBox").classList.remove("hidden"); $("qResult").classList.add("hidden");
  renderQ();
}
function setMarker(){
  const pct = qi===0 ? 0 : score/qi;
  $("quizMarker").style.left = (pct*100)+"%";
}
function renderQ(){
  const [text,opts,right] = qs[qi];
  $("quizCount").textContent = `Fråga ${qi+1} av ${qs.length} · ${score} rätt`;
  $("qText").textContent = text;
  $("qExplain").classList.add("hidden"); $("qNext").classList.add("hidden");
  const order = opts.length>2 ? shuffle(opts.map((o,i)=>i)) : opts.map((o,i)=>i);
  $("qOpts").innerHTML = order.map(i=>`<button class="opt" data-i="${i}">${opts[i]}</button>`).join("");
  setMarker();
}
$("qOpts").addEventListener("click",e=>{
  const b=e.target.closest(".opt"); if(!b||b.disabled) return;
  const [text,opts,right,why] = qs[qi];
  const pick=+b.dataset.i;
  $("qOpts").querySelectorAll(".opt").forEach(o=>{
    o.disabled=true;
    if(+o.dataset.i===right) o.classList.add("right");
  });
  if(pick===right){ score++; $("qExplain").textContent = "Rätt! "+why; }
  else { b.classList.add("wrong"); missed.push(qs[qi]); $("qExplain").textContent = "Inte riktigt. "+why; }
  $("quizCount").textContent = `Fråga ${qi+1} av ${qs.length} · ${score} rätt`;
  $("qExplain").classList.remove("hidden");
  $("qNext").textContent = qi===qs.length-1 ? "Se resultat" : "Nästa fråga";
  $("qNext").classList.remove("hidden");
  $("qNext").focus();
});
$("qNext").addEventListener("click",()=>{
  qi++;
  if(qi<qs.length){ renderQ(); return; }
  setMarker();
  $("qBox").classList.add("hidden"); $("qResult").classList.remove("hidden");
  $("qScore").textContent = `${score}/${qs.length}`;
  const p = score/qs.length;
  $("qVerdict").textContent = p===1 ? "Alla rätt. Du är redo!" : p>=0.8 ? "Riktigt bra. Kolla frågorna nedan en gång till." : p>=0.5 ? "Bra jobbat. Öva på frågorna nedan och kör igen." : "Fortsätt öva. Läs igenom frågorna nedan och testa begreppskorten.";
  $("qMissed").innerHTML = missed.length ? "<h3>Öva mer på</h3><ul>"+missed.map(m=>`<li><strong>${m[0]}</strong><br>${m[1][m[2]]}</li>`).join("")+"</ul>" : "";
  $("quizCount").textContent = "Klart";
});
$("qAgain").addEventListener("click",()=>startQuiz(qs.length));

homeProgress();
</script>
</body>
</html>
